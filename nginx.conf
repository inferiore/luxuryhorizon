server {
    listen 80;
    server_name luxuryhorizon.lat www.luxuryhorizon.lat;

    # ACME challenge para Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name luxuryhorizon.lat www.luxuryhorizon.lat;

    ssl_certificate     /etc/letsencrypt/live/luxuryhorizon.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxuryhorizon.lat/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect root to biolink
    location = / {
        return 301 https://$host/website/links/;
    }

    # Serve static files with caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Fallback to index.html for SPA-style routing
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
