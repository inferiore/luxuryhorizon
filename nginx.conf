# ── HTTP: ACME challenge + redirect a HTTPS ──────────────────────────────────
server {
    listen 80;
    server_name luxuryhorizon.lat www.luxuryhorizon.lat alejandra.luxuryhorizon.lat;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Sitio principal ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name luxuryhorizon.lat www.luxuryhorizon.lat;

    ssl_certificate     /etc/letsencrypt/live/luxuryhorizon.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxuryhorizon.lat/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 301 https://$host/website/;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /website/404.html;
    location = /website/404.html { internal; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}

# ── HTTPS: Influencer — Alejandra ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name alejandra.luxuryhorizon.lat;

    ssl_certificate     /etc/letsencrypt/live/alejandra.luxuryhorizon.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alejandra.luxuryhorizon.lat/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/website/influencers/alejandra;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
