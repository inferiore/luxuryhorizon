<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Luxury Horizon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --midnight: #0A1A32;
      --golden:   #B79A49;
      --golden-light: #d4b86a;
      --smoke:    #F0F0F0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--midnight);
      color: var(--smoke);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    /* ── Starfield ── */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Glow orb ── */
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(183,154,73,0.08) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .tag {
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--golden);
      border: 1px solid rgba(183,154,73,0.3);
      padding: 0.35rem 1rem;
      border-radius: 50px;
    }

    .number {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(7rem, 20vw, 12rem);
      font-weight: 300;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(183,154,73,0.4);
      letter-spacing: 0.1em;
      user-select: none;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--golden), transparent);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--smoke);
    }

    p {
      font-size: 0.88rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: rgba(240,240,240,0.5);
      max-width: 360px;
      line-height: 1.7;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      border: 1px solid var(--golden);
      color: var(--golden);
      font-family: 'Jost', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.25s, color 0.25s;
    }
    .btn:hover {
      background: var(--golden);
      color: var(--midnight);
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="content">
    <span class="tag">Página no encontrada</span>
    <div class="number">404</div>
    <div class="divider"></div>
    <h1>Destino desconocido</h1>
    <p>La página que buscas no existe o fue movida. Vuelve al inicio y explora nuestros tours de lujo.</p>
    <a class="btn" href="/website/">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Volver al inicio
    </a>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.3,
        o: Math.random(),
        speed: Math.random() * 0.004 + 0.002,
        phase: Math.random() * Math.PI * 2,
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() / 1000;
      stars.forEach(s => {
        ctx.globalAlpha = 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(t * s.speed * 10 + s.phase));
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resize();
    initStars();
    draw();
    window.addEventListener('resize', () => { resize(); initStars(); });
  </script>

</body>
</html>
