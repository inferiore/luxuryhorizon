<html lang="es">
<head>

  <title>Luxury Horizon — Recomendado por Gabs</title>

  <meta property="og:title"       content="Luxury Horizon — Recomendado por Gabs" />
  <meta property="og:description" content="Tours y experiencias de lujo en Cartagena. Reserva con descuento especial." />
  <meta property="og:image"       content="https://luxuryhorizon.lat/website/images/hero-1.jpg" />
  <meta property="og:locale"      content="es_CO" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --midnight:       #0A1A32;
      --midnight-light: #112244;
      --golden:         #B79A49;
      --golden-light:   #d4b86a;
      --smoke:          #F0F0F0;
      --bronze:         #A56C30;
      --teal:           #44F0F7;
    }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      font-family: 'Raleway', sans-serif;
      background: var(--midnight);
      display: flex;
      align-items: stretch;
      overflow-x: hidden;
    }

    /* ── Split layout ── */
    .split {
      display: flex;
      width: 100%;
      min-height: 100dvh;
      flex-direction: column;
    }

    /* Photo panel */
    .photo-panel {
      flex: 0 0 45vh;
      position: relative;
      overflow: hidden;
    }
    .photo-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, var(--midnight) 100%);
    }
    .photo-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Content panel */
    .content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.8rem 3rem;
      position: relative;
      z-index: 1;
    }

    /* Floating logo */
    .logo-float {
      position: relative;
      width: 90px;
      height: 90px;
      margin-top: -45px;
      margin-bottom: 1.2rem;
      z-index: 2;
    }
    .logo-float::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid rgba(183,154,73,0.5);
      box-shadow: 0 0 20px rgba(183,154,73,0.3);
    }
    .logo-float img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(183,154,73,0.6);
    }

    .tag {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--golden);
      background: rgba(183,154,73,0.1);
      border: 1px solid rgba(183,154,73,0.25);
      padding: 0.3rem 1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }

    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--smoke);
      text-align: center;
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 0 30px rgba(183,154,73,0.3);
      margin-bottom: 0.3rem;
    }
    .brand-sub {
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      color: var(--golden);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 0.7rem;
    }
    .recom {
      font-size: 0.7rem;
      color: rgba(240,240,240,0.5);
      text-align: center;
      font-style: italic;
      margin-bottom: 1.8rem;
    }
    .recom strong { color: var(--golden-light); font-style: normal; }

    /* Divider */
    .line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(183,154,73,0.3), transparent);
      margin-bottom: 1.8rem;
    }

    /* Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 0.85rem; width: 100%; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 0.75rem; width: 100%; padding: 0.95rem 1.5rem;
      border-radius: 12px; border: none; cursor: pointer;
      font-family: 'Raleway', sans-serif; font-size: 0.74rem;
      font-weight: 500; letter-spacing: 0.1em;
      text-transform: uppercase; text-decoration: none;
      transition: all 0.25s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-wa {
      background: rgba(7,94,84,0.15);
      border: 1px solid rgba(37,211,102,0.25);
      color: #25D366;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(37,211,102,0.12);
      animation: wa-glow 3s ease-in-out infinite;
    }
    @keyframes wa-glow {
      0%, 100% { color: #25D366; box-shadow: 0 4px 16px rgba(37,211,102,0.12); }
      50%       { color: #7EEAAA; box-shadow: 0 4px 24px rgba(37,211,102,0.3); }
    }
    .btn-wa:hover { background: rgba(7,94,84,0.25); border-color: rgba(37,211,102,0.5); transform: translateY(-1px); }
    .btn-ig {
      background: rgba(255,255,255,0.04);
      color: var(--smoke);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-ig:hover { border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .btn-tiktok {
      background: rgba(255,255,255,0.04);
      color: var(--smoke);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-tiktok:hover { border-color: rgba(255,255,255,0.22); transform: translateY(-1px); }
    .btn-icon { width: 18px; height: 18px; flex-shrink: 0; fill: currentColor; }

    .footer {
      margin-top: 2rem;
      font-size: 0.54rem;
      letter-spacing: 0.18em;
      color: rgba(183,154,73,0.18);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
