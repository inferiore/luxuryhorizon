<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Luxury Horizon — Recomendado por Gabs</title>
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Luxury Horizon — Recomendado por Gabs" />
  <meta property="og:description" content="Tours de lujo en Cartagena y Medellín. Reserva con atención personalizada." />
  <meta property="og:image"       content="https://luxuryhorizon.lat/website/images/hero-1.jpg" />
  <meta property="og:locale"      content="es_CO" />
  <meta name="twitter:card"       content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Raleway:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ocean:     #041828;
      --sea:       #072840;
      --horizon:   #0D4A6A;
      --turquoise: #26C0D0;
      --sand:      #D4A84B;
      --sand-l:    #ECC86A;
      --sunset:    #E87040;
      --cream:     #F0ECE4;
      --muted:     rgba(240,236,228,0.42);
    }

    html, body {
      min-height: 100dvh;
      background: var(--ocean);
      font-family: 'Raleway', sans-serif;
      color: var(--cream);
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Hero photo ── */
    .hero {
      width: 100%;
      height: min(60vw, 250px);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      display: block;
      filter: brightness(0.88) saturate(1.08);
    }
    /* Sky-to-ocean fade */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(4,24,40,0.15) 0%,
        transparent 40%,
        rgba(4,24,40,0.55) 75%,
        var(--ocean) 100%
      );
      z-index: 1;
    }
    /* Subtle teal tint overlay — makes photo feel underwater/tropical */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(38,192,208,0.06) 0%,
        transparent 60%
      );
      z-index: 1;
    }

    /* ── Horizon glow on photo ── */
    .horizon-line {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(38,192,208,0.4) 20%,
        var(--turquoise) 50%,
        rgba(38,192,208,0.4) 80%,
        transparent 100%
      );
      box-shadow: 0 0 14px rgba(38,192,208,0.6), 0 0 32px rgba(38,192,208,0.2);
      z-index: 2;
    }

    /* Name over photo */
    .hero-name {
      position: absolute;
      bottom: 0.9rem;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: clamp(2.6rem, 15vw, 3.8rem);
      font-weight: 300;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      color: var(--cream);
      text-transform: uppercase;
      z-index: 3;
      text-shadow:
        0 0 24px rgba(38,192,208,0.35),
        0 2px 12px rgba(4,24,40,0.7);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.8s ease 0.15s forwards;
    }

    /* ── Rec tag ── */
    .rec-tag {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 1.3rem 0 1.8rem;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.65s forwards;
    }
    .rec-tag em { color: var(--sand-l); font-style: normal; font-family: 'Raleway', sans-serif; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; }

    /* ── Brand ── */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.8rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.8s forwards;
    }
    .logo-wrap {
      position: relative;
      width: 58px;
      height: 58px;
      margin-bottom: 0.6rem;
    }
    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(38,192,208,0.18) 0%, transparent 70%);
    }
    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1px solid rgba(38,192,208,0.35);
      box-shadow: 0 0 12px rgba(38,192,208,0.2);
    }
    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid rgba(212,168,75,0.4);
    }
    .logo-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: var(--sand);
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 20px rgba(212,168,75,0.25);
    }
    .brand-tagline {
      font-size: 0.5rem;
      letter-spacing: 0.28em;
      color: rgba(38,192,208,0.55);
      text-transform: uppercase;
      text-align: center;
    }

    /* ── Horizon separator ── */
    .sep {
      width: 85%;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin: 1.4rem 0 1.4rem;
      opacity: 0;
      animation: fadeIn 0.5s ease 1.0s forwards;
    }
    .sep::before, .sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(38,192,208,0.3), transparent);
    }
    .sep-icon {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: rgba(38,192,208,0.5);
      text-transform: uppercase;
    }

    /* ── Destinations ── */
    .destinations {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.05s forwards;
    }
    .dest-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 50px;
      font-size: 0.56rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .dest-pill.active {
      background: rgba(38,192,208,0.1);
      border: 1px solid rgba(38,192,208,0.28);
      color: var(--turquoise);
    }
    .dest-pill.soon {
      background: rgba(212,168,75,0.06);
      border: 1px solid rgba(212,168,75,0.18);
      color: rgba(212,168,75,0.5);
    }
    .dest-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dest-pill.active  .dest-dot { background: var(--turquoise); box-shadow: 0 0 5px rgba(38,192,208,0.7); }
    .dest-pill.soon    .dest-dot { background: rgba(212,168,75,0.4); }

    /* ── Buttons ── */
    .cta {
      width: calc(100% - 2.4rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.15s forwards;
    }

    /* WhatsApp — sunset coral, the HERO action */
    .btn-wa {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      width: 100%;
      padding: 1.2rem 1.5rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: 'Raleway', sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg,
        #B84828 0%,
        #E87040 28%,
        #F09060 52%,
        #E87040 76%,
        #B84828 100%
      );
      background-size: 270% auto;
      color: #fff;
      box-shadow:
        0 8px 32px rgba(232,112,64,0.48),
        0 2px 8px rgba(232,112,64,0.22),
        inset 0 1px 0 rgba(255,255,255,0.18);
      animation: sunset-shimmer 5s linear infinite, sunset-breathe 2.8s ease-in-out infinite;
    }
    @keyframes sunset-shimmer { to { background-position: 270% center; } }
    @keyframes sunset-breathe {
      0%, 100% {
        box-shadow: 0 8px 32px rgba(232,112,64,0.48), 0 2px 8px rgba(232,112,64,0.22), inset 0 1px 0 rgba(255,255,255,0.18);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 14px 48px rgba(240,144,96,0.68), 0 4px 14px rgba(232,112,64,0.38), inset 0 1px 0 rgba(255,255,255,0.22);
        transform: scale(1.012);
      }
    }
    .btn-wa:active { transform: scale(0.97) !important; animation-play-state: paused; }

    /* Instagram — teal accent, secondary */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.9rem 1.5rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Raleway', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.25s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-ig {
      background: rgba(38,192,208,0.06);
      color: rgba(240,236,228,0.65);
      border: 1px solid rgba(38,192,208,0.18);
    }
    .btn-ig:hover { background: rgba(38,192,208,0.12); border-color: rgba(38,192,208,0.4); color: var(--cream); transform: translateY(-1px); }

    .btn-tiktok {
      background: transparent;
      color: rgba(240,236,228,0.32);
      border: 1px solid rgba(240,236,228,0.07);
    }
    .btn-tiktok:hover { border-color: rgba(240,236,228,0.16); color: rgba(240,236,228,0.6); transform: translateY(-1px); }

    .btn-icon { width: 17px; height: 17px; flex-shrink: 0; fill: currentColor; }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      padding: 1.8rem 0 max(1.5rem, env(safe-area-inset-bottom));
      font-size: 0.47rem;
      letter-spacing: 0.2em;
      color: rgba(38,192,208,0.12);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.3s forwards;
    }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    /* Stars */
    let stars = [];
    function initStars() {
      stars = Array.from({ length: 50 }, () => ({
        x:     Math.random() * canvas.width,
        y:     Math.random() * canvas.height,
        r:     Math.random() * 0.7 + 0.15,
        phase: Math.random() * Math.PI * 2,
        spd:   Math.random() * 0.003 + 0.0008,
      }));
    }

    /* Slow horizontal wave lines — evoke the sea */
    const waves = [
      { y: 0.28, amp: 4,  freq: 0.008, spd: 0.25, alpha: 0.04, color: '#26C0D0' },
      { y: 0.45, amp: 6,  freq: 0.006, spd: 0.18, alpha: 0.05, color: '#26C0D0' },
      { y: 0.62, amp: 5,  freq: 0.007, spd: 0.22, alpha: 0.04, color: '#26C0D0' },
      { y: 0.80, amp: 8,  freq: 0.005, spd: 0.14, alpha: 0.05, color: '#D4A84B' },
    ];

    /* Particles — small teal sparkles */
    let particles = [];
    function spawnParticle() {
      return {
        x:       Math.random() * canvas.width,
        y:       canvas.height + Math.random() * 100,
        r:       Math.random() * 1.2 + 0.3,
        vx:      (Math.random() - 0.5) * 0.25,
        vy:      -(Math.random() * 0.4 + 0.15),
        life:    0,
        maxLife: Math.random() * 280 + 200,
        isTeal:  Math.random() > 0.4,
      };
    }
    function initParticles() {
      particles = Array.from({ length: 18 }, spawnParticle);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() / 1000;

      /* Stars */
      stars.forEach(s => {
        ctx.globalAlpha = 0.06 + 0.14 * (0.5 + 0.5 * Math.sin(t * s.spd * 10 + s.phase));
        ctx.fillStyle   = '#F0ECE4';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      /* Wave lines */
      waves.forEach(w => {
        ctx.globalAlpha = w.alpha;
        ctx.strokeStyle = w.color;
        ctx.lineWidth   = 1;
        ctx.beginPath();
        for (let x = 0; x <= canvas.width; x += 2) {
          const y = w.y * canvas.height + Math.sin(x * w.freq + t * w.spd) * w.amp;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      });

      /* Particles */
      particles.forEach((p, i) => {
        p.x  += p.vx;
        p.y  += p.vy;
        p.life++;
        const progress  = p.life / p.maxLife;
        ctx.globalAlpha = 0.32 * Math.sin(progress * Math.PI);
        ctx.fillStyle   = p.isTeal ? '#26C0D0' : '#D4A84B';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        if (p.life >= p.maxLife) particles[i] = spawnParticle();
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resize();
    initStars();
    initParticles();
    draw();
    window.addEventListener('resize', () => { resize(); initStars(); });
  </script>
