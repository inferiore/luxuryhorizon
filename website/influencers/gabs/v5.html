<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Luxury Horizon — Recomendado por Gabs</title>
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Luxury Horizon — Recomendado por Gabs" />
  <meta property="og:description" content="Tours de lujo en Cartagena y Medellín. Reserva con atención personalizada." />
  <meta property="og:image"       content="https://luxuryhorizon.lat/website/images/hero-1.jpg" />
  <meta property="og:locale"      content="es_CO" />
  <meta name="twitter:card"       content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Raleway:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --noir:    #0D0910;
      --coral:   #D85840;
      --ember:   #F07848;
      --amber:   #E8A050;
      --cream:   #F5EAE0;
      --muted:   rgba(245,234,224,0.42);
    }

    html, body {
      min-height: 100dvh;
      background: var(--noir);
      font-family: 'Raleway', sans-serif;
      color: var(--cream);
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Hero photo ── */
    .hero {
      width: 100%;
      height: min(62vw, 260px);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
      filter: brightness(0.92) saturate(1.1);
    }
    /* Gradient fade to page background */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 30%,
        rgba(13,9,16,0.7) 75%,
        var(--noir) 100%
      );
    }
    /* Name overlaid on photo */
    .hero-name {
      position: absolute;
      bottom: 0.8rem;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 17vw, 4.2rem);
      font-weight: 300;
      letter-spacing: 0.45em;
      text-indent: 0.45em;
      color: var(--cream);
      text-transform: uppercase;
      z-index: 2;
      text-shadow:
        0 2px 16px rgba(216,88,64,0.5),
        0 0 40px rgba(216,88,64,0.2);
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.8s ease 0.15s forwards;
    }

    /* ── Rec tag ── */
    .rec-tag {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 1.2rem 0 1.6rem;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.6s forwards;
    }
    .rec-tag strong {
      color: var(--amber);
      font-style: normal;
      font-family: 'Raleway', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── Brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0 0.5rem;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.8s forwards;
    }
    .logo-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid rgba(232,160,80,0.45);
      box-shadow: 0 0 14px rgba(232,160,80,0.2);
      flex-shrink: 0;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text { display: flex; flex-direction: column; }
    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      color: var(--amber);
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 0.48rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    /* ── Thin ornament ── */
    .ornament {
      width: 75%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.95s forwards;
    }
    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,160,80,0.3), transparent);
    }
    .ornament-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 7px rgba(232,160,80,0.7);
    }

    /* ── CTA group ── */
    .cta {
      width: calc(100% - 2.4rem);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.05s forwards;
    }

    /* WhatsApp — coral hero button (color from her top) */
    .btn-wa {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      width: 100%;
      padding: 1.2rem 1.5rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: 'Raleway', sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg,
        #B83428 0%,
        #D85840 25%,
        #F07848 50%,
        #D85840 75%,
        #B83428 100%
      );
      background-size: 280% auto;
      color: #fff;
      box-shadow:
        0 8px 32px rgba(216,88,64,0.5),
        0 2px 8px rgba(216,88,64,0.25),
        inset 0 1px 0 rgba(255,255,255,0.15);
      animation: coral-shimmer 5s linear infinite, coral-breathe 2.8s ease-in-out infinite;
    }
    @keyframes coral-shimmer { to { background-position: 280% center; } }
    @keyframes coral-breathe {
      0%, 100% {
        box-shadow: 0 8px 32px rgba(216,88,64,0.5), 0 2px 8px rgba(216,88,64,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 12px 48px rgba(240,120,72,0.7), 0 4px 14px rgba(216,88,64,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        transform: scale(1.013);
      }
    }
    .btn-wa:active { transform: scale(0.97) !important; animation-play-state: paused; }

    /* Secondary buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.88rem 1.5rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Raleway', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.25s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-ig {
      background: rgba(245,234,224,0.05);
      color: rgba(245,234,224,0.6);
      border: 1px solid rgba(245,234,224,0.1);
    }
    .btn-ig:hover { background: rgba(245,234,224,0.09); border-color: rgba(245,234,224,0.22); color: var(--cream); transform: translateY(-1px); }

    .btn-tiktok {
      background: transparent;
      color: rgba(245,234,224,0.35);
      border: 1px solid rgba(245,234,224,0.07);
    }
    .btn-tiktok:hover { border-color: rgba(245,234,224,0.15); color: rgba(245,234,224,0.6); transform: translateY(-1px); }

    .btn-icon { width: 17px; height: 17px; flex-shrink: 0; fill: currentColor; }

    /* ── Destinations ── */
    .destinations {
      margin: 1.6rem 0 0;
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      line-height: 2;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.25s forwards;
    }
    .dest-active { color: var(--amber); }
    .dest-soon { color: rgba(216,88,64,0.6); }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      padding: 1.6rem 0 max(1.5rem, env(safe-area-inset-bottom));
      font-size: 0.47rem;
      letter-spacing: 0.2em;
      color: rgba(216,88,64,0.15);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.35s forwards;
    }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    /* Stars — cream/warm tint, very subtle */
    let stars = [];
    function initStars() {
      stars = Array.from({ length: 55 }, () => ({
        x:     Math.random() * canvas.width,
        y:     Math.random() * canvas.height,
        r:     Math.random() * 0.75 + 0.15,
        phase: Math.random() * Math.PI * 2,
        spd:   Math.random() * 0.003 + 0.001,
      }));
    }

    /* Particles — coral + amber rising from bottom */
    let particles = [];
    function spawnParticle() {
      const isAmber = Math.random() > 0.55;
      return {
        x:       Math.random() * canvas.width,
        y:       canvas.height + Math.random() * 120,
        r:       Math.random() * 1.6 + 0.4,
        vx:      (Math.random() - 0.5) * 0.35,
        vy:      -(Math.random() * 0.55 + 0.22),
        life:    0,
        maxLife: Math.random() * 260 + 180,
        color:   isAmber ? '#E8A050' : '#D85840',
      };
    }
    function initParticles() {
      particles = Array.from({ length: 22 }, spawnParticle);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() / 1000;

      stars.forEach(s => {
        ctx.globalAlpha = 0.07 + 0.16 * (0.5 + 0.5 * Math.sin(t * s.spd * 10 + s.phase));
        ctx.fillStyle   = '#F5EAE0';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life++;
        const progress     = p.life / p.maxLife;
        ctx.globalAlpha    = 0.38 * Math.sin(progress * Math.PI);
        ctx.fillStyle      = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        if (p.life >= p.maxLife) particles[i] = spawnParticle();
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resize();
    initStars();
    initParticles();
    draw();
    window.addEventListener('resize', () => { resize(); initStars(); });
  </script>
