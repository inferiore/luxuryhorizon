<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Luxury Horizon — Recomendado por Gabs</title>
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Luxury Horizon — Recomendado por Gabs" />
  <meta property="og:description" content="Tours de lujo en Cartagena y Medellín. Reserva con atención personalizada." />
  <meta property="og:image"       content="https://luxuryhorizon.lat/website/images/hero-1.jpg" />
  <meta property="og:locale"      content="es_CO" />
  <meta name="twitter:card"       content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --midnight:       #0A1A32;
      --midnight-light: #112244;
      --golden:         #B79A49;
      --golden-light:   #d4b86a;
      --smoke:          #F0F0F0;
      --bronze:         #A56C30;
      --teal:           #44F0F7;
    }

    html, body {
      min-height: 100dvh;
      background: var(--midnight);
      font-family: 'Raleway', sans-serif;
      color: var(--smoke);
      overflow-x: hidden;
    }

    /* ── Canvas particles ── */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Page wrapper ── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(2rem, env(safe-area-inset-top)) 1.6rem max(2rem, env(safe-area-inset-bottom));
      gap: 0;
    }

    /* ── Recomendado tag ── */
    .rec-tag {
      font-size: 0.58rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--bronze);
      margin-bottom: 1.4rem;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.6s ease 0.1s forwards;
    }

    /* ── Name ── */
    .name {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.2rem, 18vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--smoke);
      text-align: center;
      line-height: 1;
      margin-bottom: 1.2rem;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    /* ── Arch photo frame ── */
    .arch-wrap {
      position: relative;
      width: 200px;
      margin-bottom: 1.4rem;
      opacity: 0;
      transform: translateY(20px) scale(0.97);
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    .arch-frame {
      width: 200px;
      height: 265px;
      border-radius: 100px 100px 24px 24px;
      overflow: hidden;
      border: 1.5px solid rgba(183,154,73,0.45);
      box-shadow:
        0 0 0 5px rgba(183,154,73,0.06),
        0 0 35px rgba(183,154,73,0.12),
        0 24px 56px rgba(0,0,0,0.55);
      position: relative;
    }

    .arch-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Subtle inner glow on photo */
    .arch-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 30px rgba(10,26,50,0.3);
      pointer-events: none;
    }

    /* Teal dot accents on sides of arch */
    .arch-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal), 0 0 16px rgba(68,240,247,0.5);
      top: 50%;
    }
    .arch-dot-l { left: -12px; }
    .arch-dot-r { right: -12px; }

    /* ── Teal separator ── */
    .teal-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(68,240,247,0.2) 20%,
        var(--teal) 50%,
        rgba(68,240,247,0.2) 80%,
        transparent 100%
      );
      box-shadow: 0 0 10px rgba(68,240,247,0.4), 0 0 24px rgba(68,240,247,0.15);
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.85s forwards;
    }

    /* ── Brand block ── */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.95s forwards;
    }

    .logo-ring {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid rgba(183,154,73,0.55);
      box-shadow: 0 0 14px rgba(183,154,73,0.25);
      margin-bottom: 0.5rem;
    }
    .logo-ring img { width: 100%; height: 100%; object-fit: cover; }

    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: var(--golden-light);
      text-transform: uppercase;
      text-align: center;
    }
    .brand-sub {
      font-size: 0.54rem;
      letter-spacing: 0.24em;
      color: rgba(240,240,240,0.4);
      text-transform: uppercase;
      text-align: center;
    }

    /* ── Buttons ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.1s forwards;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.95rem 1.5rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Raleway', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .btn:active { transform: scale(0.97); }

    /* WhatsApp — dark bg, animated green text */
    .btn-wa {
      background: rgba(7,94,84,0.15);
      border: 1px solid rgba(37,211,102,0.25);
      color: #25D366;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(37,211,102,0.12);
      background-clip: padding-box;
      animation: wa-glow 3s ease-in-out infinite;
    }
    @keyframes wa-glow {
      0%, 100% { color: #25D366; box-shadow: 0 4px 16px rgba(37,211,102,0.12); }
      50%       { color: #7EEAAA; box-shadow: 0 4px 24px rgba(37,211,102,0.3); }
    }
    .btn-wa:hover { background: rgba(7,94,84,0.25); border-color: rgba(37,211,102,0.5); transform: translateY(-1px); }

    /* Instagram — midnight light with golden border */
    .btn-ig {
      background: var(--midnight-light);
      color: var(--smoke);
      border: 1px solid rgba(183,154,73,0.3);
    }
    .btn-ig:hover { border-color: var(--golden); transform: translateY(-1px); }

    /* TikTok — very subtle */
    .btn-tiktok {
      background: rgba(255,255,255,0.03);
      color: rgba(240,240,240,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-tiktok:hover { border-color: rgba(255,255,255,0.18); color: var(--smoke); transform: translateY(-1px); }

    .btn-icon { width: 17px; height: 17px; flex-shrink: 0; fill: currentColor; }

    /* ── Destinations ── */
    .destinations {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(240,240,240,0.35);
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.3s forwards;
      flex-wrap: wrap;
      justify-content: center;
    }
    .dest-active { color: var(--golden); }
    .dest-soon {
      color: var(--teal);
      opacity: 0.6;
    }
    .dest-sep { color: rgba(240,240,240,0.15); }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      padding-top: 1.5rem;
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      color: rgba(183,154,73,0.12);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.4s forwards;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    // Stars (small, subtle)
    let stars = [];
    function initStars() {
      stars = Array.from({ length: 80 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 0.9 + 0.2,
        phase: Math.random() * Math.PI * 2,
        spd: Math.random() * 0.003 + 0.001,
      }));
    }

    // Golden particles (floating upward)
    let particles = [];
    function initParticles() {
      particles = Array.from({ length: 18 }, () => spawnParticle());
    }
    function spawnParticle() {
      return {
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * 200,
        r: Math.random() * 1.8 + 0.6,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -(Math.random() * 0.6 + 0.3),
        alpha: Math.random() * 0.5 + 0.2,
        life: 0,
        maxLife: Math.random() * 300 + 200,
      };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() / 1000;

      // Stars
      stars.forEach(s => {
        ctx.globalAlpha = 0.1 + 0.3 * (0.5 + 0.5 * Math.sin(t * s.spd * 10 + s.phase));
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Golden particles
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life++;
        const progress = p.life / p.maxLife;
        const alpha = p.alpha * Math.sin(progress * Math.PI);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#B79A49';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        if (p.life >= p.maxLife) particles[i] = spawnParticle();
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resize();
    initStars();
    initParticles();
    draw();
    window.addEventListener('resize', () => { resize(); initStars(); });
  </script>
