<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Horizon — Recomendado por Gabs</title>
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Luxury Horizon — Recomendado por Gabs" />
  <meta property="og:description" content="Tours y experiencias de lujo en Cartagena. Reserva con descuento especial." />
  <meta property="og:image"       content="https://luxuryhorizon.lat/website/images/hero-1.jpg" />
  <meta property="og:locale"      content="es_CO" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --midnight:       #0A1A32;
      --midnight-light: #112244;
      --golden:         #B79A49;
      --golden-light:   #d4b86a;
      --smoke:          #F0F0F0;
      --bronze:         #A56C30;
      --teal:           #44F0F7;
    }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      font-family: 'Raleway', sans-serif;
      background: var(--midnight);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 2.5rem 1.5rem 3rem;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Nebula glow */
    .glow {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(183,154,73,0.09) 0%, transparent 65%);
      top: -60px; left: 50%;
      transform: translateX(-50%);
    }
    .glow-2 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(201,130,106,0.07) 0%, transparent 65%);
      bottom: 80px; right: -60px;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Top label ── */
    .top-label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(240,237,232,0.4);
      letter-spacing: 0.12em;
      margin-bottom: 1.6rem;
      text-align: center;
    }
    .top-label span { color: var(--golden-light); font-style: normal; }

    /* ── Portrait frame ── */
    .portrait-wrap {
      position: relative;
      width: 220px;
      margin-bottom: 1.8rem;
    }
    .portrait-frame {
      position: relative;
      width: 220px;
      height: 280px;
      border-radius: 110px 110px 80px 80px;
      overflow: hidden;
      border: 1.5px solid rgba(183,154,73,0.5);
      box-shadow:
        0 0 0 6px rgba(183,154,73,0.06),
        0 0 40px rgba(183,154,73,0.15),
        0 20px 60px rgba(0,0,0,0.6);
    }
    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--golden);
      border-style: solid;
      opacity: 0.5;
    }
    .corner-tl { top: -6px; left: -6px; border-width: 1.5px 0 0 1.5px; border-radius: 3px 0 0 0; }
    .corner-tr { top: -6px; right: -6px; border-width: 1.5px 1.5px 0 0; border-radius: 0 3px 0 0; }
    .corner-bl { bottom: -6px; left: -6px; border-width: 0 0 1.5px 1.5px; border-radius: 0 0 0 3px; }
    .corner-br { bottom: -6px; right: -6px; border-width: 0 1.5px 1.5px 0; border-radius: 0 0 3px 0; }

    /* Logo badge on photo */
    .logo-badge {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(183,154,73,0.6);
      box-shadow: 0 0 16px rgba(183,154,73,0.3);
      background: var(--midnight);
      z-index: 2;
    }
    .logo-badge img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Brand ── */
    .brand {
      margin-top: 1.4rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.6rem;
    }
    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--smoke);
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(183,154,73,0.25);
    }
    .brand-sub {
      font-size: 0.56rem;
      letter-spacing: 0.28em;
      color: var(--golden);
      text-transform: uppercase;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      margin: 1.2rem 0 1.5rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(183,154,73,0.3), transparent);
    }
    .divider-text {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: rgba(183,154,73,0.5);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── Buttons ── */
    .btn-group { display: flex; flex-direction: column; gap: 0.85rem; width: 100%; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 0.75rem; width: 100%; padding: 1rem 1.5rem;
      border-radius: 50px; border: none; cursor: pointer;
      font-family: 'Raleway', sans-serif; font-size: 0.72rem;
      font-weight: 500; letter-spacing: 0.12em;
      text-transform: uppercase; text-decoration: none;
      transition: all 0.25s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-ig {
      background: linear-gradient(135deg, #6b4a1e, #B79A49, #d4b86a, #B79A49);
      background-size: 250% auto;
      color: #0A1A32;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(183,154,73,0.35);
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer { to { background-position: 250% center; } }
    .btn-ig:hover { box-shadow: 0 6px 28px rgba(183,154,73,0.5); transform: translateY(-1px); }
    .btn-tiktok {
      background: transparent;
      color: var(--smoke);
      border: 1px solid rgba(240,237,232,0.12);
    }
    .btn-tiktok:hover { border-color: rgba(240,237,232,0.25); transform: translateY(-1px); }
    .btn-wa {
      background: transparent;
      color: #7EEAAA;
      border: 1px solid rgba(37,211,102,0.2);
    }
    .btn-wa:hover { border-color: rgba(37,211,102,0.4); transform: translateY(-1px); }
    .btn-icon { width: 17px; height: 17px; flex-shrink: 0; fill: currentColor; }

    .footer {
      margin-top: 2rem;
      font-size: 0.52rem;
      letter-spacing: 0.2em;
      color: rgba(183,154,73,0.15);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function initStars() {
      stars = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.1 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.003 + 0.001,
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() / 1000;
      stars.forEach(s => {
        ctx.globalAlpha = 0.15 + 0.45 * (0.5 + 0.5 * Math.sin(t * s.speed * 10 + s.phase));
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    resize(); initStars(); draw();
    window.addEventListener('resize', () => { resize(); initStars(); });
  </script>
