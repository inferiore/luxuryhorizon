<script>const INFLUENCER_SOURCE = 'jhenn';</script>
<div style="position:relative;z-index:3;display:flex;align-items:center;gap:1rem;padding:2.5rem 1.5rem 0;max-width:480px;margin:0 auto;">
  <div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(183,154,73,0.4),transparent);"></div>

  </div>
  <div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(183,154,73,0.4),transparent);"></div>
</div>
<section id="contact" style="position:relative;z-index:3;background:#fff;padding:44px 20px 60px;">
  <div style="max-width:460px;margin:0 auto;font-family:'Raleway',sans-serif;">
    <h2 style="font-family:'Cinzel',serif;color:#0A1A32;text-align:center;font-size:1.3rem;margin:0 0 6px;letter-spacing:3px;">CONTÁCTANOS</h2>
    <p style="color:#999;text-align:center;margin:0 0 26px;font-size:.88rem;">Te llamamos nosotros — solo déjanos tu nombre y WhatsApp.</p>
    <form id="lead-form" onsubmit="submitLead(event)">
      <div style="margin-bottom:14px;">
        <label style="color:#0A1A32;font-size:.72rem;letter-spacing:1.5px;display:block;margin-bottom:5px;font-weight:600;">NOMBRE *</label>
        <input id="lf-name" type="text" placeholder="Tu nombre completo" required style="width:100%;padding:11px 14px;border:1.5px solid #e8e8e8;background:#fafafa;color:#1a1a1a;border-radius:6px;font-size:.95rem;box-sizing:border-box;outline:none;font-family:'Raleway',sans-serif;" onfocus="this.style.borderColor='#B79A49'" onblur="this.style.borderColor='#e8e8e8'">
      </div>
      <div style="margin-bottom:14px;">
        <label style="color:#0A1A32;font-size:.72rem;letter-spacing:1.5px;display:block;margin-bottom:5px;font-weight:600;">WHATSAPP *</label>
        <div style="display:flex;gap:8px;">
          <div id="lf-prefix-box" style="display:flex;align-items:center;gap:5px;background:#fafafa;border:1.5px solid #e8e8e8;border-radius:6px;padding:0 12px;min-width:82px;font-size:.95rem;color:#1a1a1a;">
            <span id="lf-flag">🌎</span><span id="lf-prefix" style="color:#B79A49;font-weight:700;">+</span>
          </div>
          <input id="lf-phone" type="tel" placeholder="3001234567" required style="flex:1;padding:11px 14px;border:1.5px solid #e8e8e8;background:#fafafa;color:#1a1a1a;border-radius:6px;font-size:.95rem;outline:none;font-family:'Raleway',sans-serif;" onfocus="this.style.borderColor='#B79A49'" onblur="this.style.borderColor='#e8e8e8'">
        </div>
        <p style="color:#c0c0c0;font-size:.72rem;margin:4px 0 0 2px;">Número local sin código de país.</p>
      </div>
      <div style="margin-bottom:14px;">
        <label style="color:#0A1A32;font-size:.72rem;letter-spacing:1.5px;display:block;margin-bottom:5px;font-weight:600;">EMAIL <span style="color:#ccc;font-weight:400;">(opcional)</span></label>
        <input id="lf-email" type="email" placeholder="tu@correo.com" style="width:100%;padding:11px 14px;border:1.5px solid #e8e8e8;background:#fafafa;color:#1a1a1a;border-radius:6px;font-size:.95rem;box-sizing:border-box;outline:none;font-family:'Raleway',sans-serif;" onfocus="this.style.borderColor='#B79A49'" onblur="this.style.borderColor='#e8e8e8'">
      </div>
      <div style="margin-bottom:20px;">
        <label style="color:#0A1A32;font-size:.72rem;letter-spacing:1.5px;display:block;margin-bottom:5px;font-weight:600;">¿QUÉ TOUR TE INTERESA? <span style="color:#ccc;font-weight:400;">(opcional)</span></label>
        <textarea id="lf-desc" rows="3" placeholder="Ej. Tour a Palmarito para 4 personas en junio" style="width:100%;padding:11px 14px;border:1.5px solid #e8e8e8;background:#fafafa;color:#1a1a1a;border-radius:6px;font-size:.95rem;box-sizing:border-box;outline:none;resize:vertical;font-family:'Raleway',sans-serif;" onfocus="this.style.borderColor='#B79A49'" onblur="this.style.borderColor='#e8e8e8'"></textarea>
      </div>
      <input type="hidden" id="lf-influencer"><input type="hidden" id="lf-country-code"><input type="hidden" id="lf-country-name"><input type="hidden" id="lf-phone-prefix">
      <button type="submit" id="lf-btn" style="width:100%;padding:14px;background:#0A1A32;color:#B79A49;font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;letter-spacing:2.5px;border:none;border-radius:6px;cursor:pointer;">QUIERO QUE ME CONTACTEN</button>
      <div id="lf-msg" style="display:none;text-align:center;margin-top:14px;font-size:.9rem;padding:11px;border-radius:6px;"></div>
    </form>
  </div>

<p style="text-align:center;font-size:.48rem;letter-spacing:.2em;color:#aaa;text-transform:uppercase;padding:20px 0 32px;font-family:'Raleway',sans-serif;">© 2026 Luxury Horizon · Todos los derechos reservados</p>
</section>
<script>
(function(){
  document.getElementById('lf-influencer').value=typeof INFLUENCER_SOURCE!=='undefined'?INFLUENCER_SOURCE:'directo';
  fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{
    const code=d.country_code||'',calling=(d.country_calling_code||'').replace('+','');
    const flag=code?String.fromCodePoint(...[...code].map(c=>0x1F1E6+c.charCodeAt(0)-65)):'🌎';
    document.getElementById('lf-flag').textContent=flag;
    document.getElementById('lf-prefix').textContent='+'+calling;
    document.getElementById('lf-country-code').value=code;
    document.getElementById('lf-country-name').value=d.country_name||'';
    document.getElementById('lf-phone-prefix').value=calling;
  }).catch(()=>{});
})();
async function submitLead(e){
  e.preventDefault();
  const btn=document.getElementById('lf-btn'),msg=document.getElementById('lf-msg');
  const prefix=document.getElementById('lf-phone-prefix').value;
  const phone=document.getElementById('lf-phone').value.replace(/\D/g,'');
  const full=prefix?'+'+prefix+phone:phone;
  btn.disabled=true;btn.textContent='Enviando...';
  try{
    const res=await fetch((window.__LEADS_API_URL||'')+'/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('lf-name').value.trim(),whatsapp_number:full,email:document.getElementById('lf-email').value.trim()||null,description:document.getElementById('lf-desc').value.trim()||null,influencer:document.getElementById('lf-influencer').value,country_code:document.getElementById('lf-country-code').value,country_name:document.getElementById('lf-country-name').value,phone_prefix:document.getElementById('lf-phone-prefix').value})}});
    if(res.ok){msg.style.display='block';msg.style.background='#f0fdf4';msg.style.color='#166534';msg.textContent='✅ ¡Listo! Te contactamos pronto por WhatsApp.';document.getElementById('lead-form').reset();document.getElementById('lf-flag').textContent='🌎';document.getElementById('lf-prefix').textContent='+';}
    else throw new Error();
  }catch{msg.style.display='block';msg.style.background='#fef2f2';msg.style.color='#991b1b';msg.textContent='❌ Hubo un error. Escríbenos directamente por WhatsApp.';}
  finally{btn.disabled=false;btn.textContent='QUIERO QUE ME CONTACTEN';}
}
</script>
