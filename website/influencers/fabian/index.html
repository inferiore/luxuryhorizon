<!DOCTYPE html>
<!-- v3: Mi elección — "Arena & Zafiro" — foto full-bleed borrosa de fondo, card de vidrio -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Luxury Horizon — Recomendado por Fabian</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Luxury Horizon — Recomendado por Fabian" />
  <meta property="og:description" content="Tours de lujo en Cartagena y Medellín. Reserva con atención personalizada." />
  <meta property="og:image" content="https://luxuryhorizon.lat/website/images/hero-1.jpg" />
  <meta property="og:locale" content="es_CO" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Raleway:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sapphire: #0A2050;
      --blue:     #1A50C0;
      --sky:      #5AA8E8;
      --sand:     #D4B878;
      --sand-l:   #ECD898;
      --white:    #F8F4EE;
      --muted:    rgba(248,244,238,0.45);
    }
    html, body { min-height: 100dvh; font-family: 'Raleway', sans-serif; overflow-x: hidden; }

    /* Background = blurred full photo */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: url('fabian-portrait.jpg') center/cover no-repeat;
      filter: blur(18px) brightness(0.45) saturate(1.3);
      transform: scale(1.06);
    }
    /* Sapphire-blue overlay gradient */
    .bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(
        160deg,
        rgba(10,32,80,0.72) 0%,
        rgba(26,80,192,0.35) 50%,
        rgba(10,32,80,0.65) 100%
      );
    }

    .page {
      position: relative; z-index: 2;
      max-width: 420px; margin: 0 auto;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: max(2rem, env(safe-area-inset-top)) 1.2rem max(2rem, env(safe-area-inset-bottom));
    }

    /* Glass card */
    .card {
      width: 100%;
      background: rgba(10,32,80,0.38);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(248,244,238,0.14);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(90,168,232,0.1);
      display: flex; flex-direction: column; align-items: center;
    }

    /* Photo panel inside card */
    .photo-panel {
      width: 100%; height: 220px;
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    .photo-panel img {
      width: 100%; height: calc(100% + 200px);
      object-fit: cover; object-position: center top;
      display: block; margin-top: -200px;
    }
    .photo-panel::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        transparent 35%,
        rgba(10,32,80,0.55) 70%,
        rgba(10,32,80,0.92) 100%
      );
    }
    /* "FABIAN" on photo */
    .photo-name {
      position: absolute; bottom: 0.8rem; left: 0; right: 0;
      text-align: center; z-index: 2;
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 14vw, 3.4rem);
      font-weight: 400; letter-spacing: clamp(0.25em, 3.5vw, 0.5em); text-indent: clamp(0.25em, 3.5vw, 0.5em);
      color: var(--white); text-transform: uppercase;
      text-shadow: 0 0 20px rgba(90,168,232,0.5), 0 2px 10px rgba(0,0,0,0.85);
      opacity: 0; transform: translateY(8px);
      animation: fadeUp 0.8s ease 0.1s forwards;
    }
    /* Blue shimmer line below photo */
    .photo-line {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--sky) 50%, transparent);
      box-shadow: 0 0 12px rgba(90,168,232,0.6);
    }

    /* Card body */
    .card-body {
      padding: 1.4rem 1.5rem 1.8rem;
      display: flex; flex-direction: column; align-items: center; width: 100%;
    }

    /* Rec tag */
    .rec-tag {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 0.88rem; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 1.3rem; text-align: center;
      opacity: 0; animation: fadeIn 0.5s ease 0.6s forwards;
    }
    .rec-tag strong {
      color: var(--sand-l); font-style: normal;
      font-family: 'Raleway', sans-serif; font-size: 0.7rem;
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Brand */
    .brand {
      display: flex; align-items: center; gap: 0.85rem;
      margin-bottom: 1.3rem;
      opacity: 0; animation: fadeUp 0.5s ease 0.75s forwards;
    }
    .logo-c {
      width: 50px; height: 50px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid rgba(212,184,120,0.5);
      box-shadow: 0 0 16px rgba(212,184,120,0.2); flex-shrink: 0;
    }
    .logo-c img { width: 100%; height: 100%; object-fit: cover; }
    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 0.88rem; font-weight: 600; letter-spacing: 0.24em;
      color: var(--sand); text-transform: uppercase;
    }
    .brand-sub {
      font-size: 0.48rem; letter-spacing: 0.18em;
      color: rgba(90,168,232,0.55); text-transform: uppercase; margin-top: 0.22rem;
    }

    /* Destinations */
    .dests {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 0.4rem; margin-bottom: 1.5rem;
      opacity: 0; animation: fadeIn 0.5s ease 0.9s forwards;
    }
    .dp {
      font-size: 0.53rem; letter-spacing: 0.18em; text-transform: uppercase;
      padding: 0.28rem 0.8rem; border-radius: 50px; font-weight: 500;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .dp.on { background: rgba(90,168,232,0.12); border: 1px solid rgba(90,168,232,0.32); color: var(--sky); }
    .dp.soon { background: rgba(212,184,120,0.08); border: 1px solid rgba(212,184,120,0.22); color: rgba(236,216,152,0.55); }
    .dp-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
    .dp.on .dp-dot { background: var(--sky); box-shadow: 0 0 5px rgba(90,168,232,0.8); }
    .dp.soon .dp-dot { background: rgba(212,184,120,0.4); }

    /* Divider */
    .divider {
      width: 80%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(248,244,238,0.12), transparent);
      margin-bottom: 1.3rem;
      opacity: 0; animation: fadeIn 0.5s ease 1.0s forwards;
    }

    /* Buttons */
    .cta {
      display: flex; flex-direction: column; gap: 0.7rem; width: 100%;
      opacity: 0; animation: fadeUp 0.5s ease 1.05s forwards;
    }
    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 0.75rem; width: 100%;
      text-decoration: none; border: none; cursor: pointer;
      font-family: 'Raleway', sans-serif;
      text-transform: uppercase; letter-spacing: 0.1em;
      transition: all 0.22s; border-radius: 12px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-wa {
      padding: 1.15rem 1.5rem; font-size: 0.75rem; font-weight: 700;
      background: linear-gradient(135deg, #0A6630, #1A9E50, #25D366, #1A9E50, #0A6630);
      background-size: 260% auto; color: #fff;
      box-shadow: 0 6px 28px rgba(37,211,102,0.42);
      animation: wa-sh 5s linear infinite, wa-br 2.8s ease-in-out infinite;
    }
    @keyframes wa-sh { to { background-position: 260% center; } }
    @keyframes wa-br {
      0%,100% { box-shadow: 0 6px 28px rgba(37,211,102,0.42); transform: scale(1); }
      50%     { box-shadow: 0 10px 42px rgba(37,211,102,0.65); transform: scale(1.012); }
    }
    .btn-wa:active { transform: scale(0.97) !important; animation-play-state: paused; }
    .btn-ig {
      padding: 0.88rem 1.5rem; font-size: 0.68rem; font-weight: 500;
      background: rgba(90,168,232,0.1); color: var(--sky);
      border: 1px solid rgba(90,168,232,0.25);
    }
    .btn-ig:hover { background: rgba(90,168,232,0.18); transform: translateY(-1px); }
    .btn-tiktok {
      padding: 0.88rem 1.5rem; font-size: 0.68rem; font-weight: 500;
      background: transparent; color: var(--muted);
      border: 1px solid rgba(248,244,238,0.1);
    }
    .btn-tiktok:hover { border-color: rgba(248,244,238,0.22); transform: translateY(-1px); }
    .btn-icon { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }

    .footer {
      margin-top: 1.5rem; font-size: 0.47rem; letter-spacing: 0.2em;
      color: rgba(90,168,232,0.15); text-transform: uppercase; text-align: center;
      opacity: 0; animation: fadeIn 0.5s ease 1.2s forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
