<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Horizon — Recomendado por Alejandra</title>

  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Luxury Horizon — Recomendado por Alejandra" />
  <meta property="og:description" content="Tours y experiencias de lujo en Cartagena. Reserva con descuento especial." />
  <meta property="og:image"       content="https://luxhorizon.netlify.app/website/images/hero-3.jpg" />
  <meta property="og:locale"      content="es_CO" />
  <meta name="twitter:card"       content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose-gold:  #C9826A;
      --rose-2:     #E8A890;
      --platinum:   #D8D8E8;
      --platinum-2: #AEAEC8;
    }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      font-family: 'Raleway', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Background photo ── */
    .bg-photo {
      position: fixed;
      inset: 0;
      background: url('https://luxuryhorizon.lat/website/images/hero-3.jpg') center/cover no-repeat;
      z-index: 0;
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(8,7,26,0.18) 0%,
        rgba(20,10,40,0.10) 50%,
        rgba(80,40,30,0.08) 100%
      );
      z-index: 1;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 2rem auto;
      padding: 2.5rem 1.8rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(8, 7, 26, 0.10);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(201,130,106,0.25);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.15);
    }

    /* ── Influencer tag ── */
    .influencer-tag {
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--rose-gold);
      margin-bottom: 1.4rem;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .influencer-tag::before,
    .influencer-tag::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,130,106,0.4), transparent);
      width: 40px;
    }

    /* ── Logo ── */
    .logo-outer {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 1.4rem;
    }
    .logo-outer::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,130,106,0.25) 0%, transparent 65%);
    }
    .logo-outer::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid rgba(201,130,106,0.5);
      box-shadow: 0 0 16px rgba(201,130,106,0.35);
    }
    .logo-img-wrap {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(201,130,106,0.7);
    }
    .logo-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Text ── */
    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-align: center;
      color: var(--platinum);
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 0 30px rgba(201,130,106,0.4);
    }
    .brand-sub {
      font-size: 0.58rem;
      letter-spacing: 0.32em;
      color: var(--rose-gold);
      text-transform: uppercase;
      margin: 0.4rem 0 0.8rem;
      text-align: center;
    }
    .recom-badge {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: rgba(216,216,232,0.7);
      text-align: center;
      margin-bottom: 1.6rem;
      font-style: italic;
    }
    .recom-badge strong {
      color: var(--rose-2);
      font-style: normal;
      font-weight: 500;
    }

    /* ── Divider ── */
    .divider {
      width: 80%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.6rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,130,106,0.4), transparent);
    }
    .divider span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--rose-gold);
      box-shadow: 0 0 6px rgba(201,130,106,0.6);
      flex-shrink: 0;
    }

    /* ── Buttons ── */
    .btn-group { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; }

    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 0.8rem; width: 100%; padding: 1rem 1.5rem;
      border-radius: 50px; border: none; cursor: pointer;
      font-family: 'Raleway', sans-serif; font-size: 0.74rem;
      font-weight: 500; letter-spacing: 0.12em;
      text-transform: uppercase; text-decoration: none;
      transition: all 0.25s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-ig-profile {
      background: linear-gradient(135deg, #9D5E4A 0%, #C9826A 40%, #E8A890 70%, #C9826A 100%);
      background-size: 200% auto;
      color: #fff; border: none;
      box-shadow: 0 4px 20px rgba(201,130,106,0.4);
      animation: btn-shimmer 5s linear infinite;
    }
    @keyframes btn-shimmer { to { background-position: 200% center; } }
    .btn-ig-profile:hover { box-shadow: 0 6px 28px rgba(201,130,106,0.55); transform: translateY(-1px); }

    .btn-tiktok {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 60%, #16213e 100%);
      color: #fff; border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    }
    .btn-tiktok:hover { border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }

    .btn-wa {
      background: linear-gradient(135deg, #0D3320 0%, #155633 50%, #1a6b40 100%);
      color: #9CF2C2; border: 1px solid rgba(37,211,102,0.2);
      box-shadow: 0 4px 18px rgba(37,211,102,0.18);
    }
    .btn-wa:hover { box-shadow: 0 6px 24px rgba(37,211,102,0.3); transform: translateY(-1px); }

    .btn-icon { width: 18px; height: 18px; flex-shrink: 0; fill: currentColor; }

    /* ── Footer ── */
    .footer {
      margin-top: 2rem;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: rgba(201,130,106,0.2);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
