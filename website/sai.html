<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/website/favicon.ico">
<link rel="icon" type="image/png" sizes="256x256" href="/website/favicon-256.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo San Andrés &amp; Providencia — Luxury Horizon</title>
<meta property="og:title"       content="Catálogo San Andrés &amp; Providencia — Luxury Horizon">
<meta property="og:description" content="Muy pronto: experiencias exclusivas en San Andrés y Providencia, Colombia.">
<meta property="og:image"       content="https://catalogo.luxuryhorizon.lat/images/og-catalogo.jpg">
<meta property="og:url"         content="https://catalogo.luxuryhorizon.lat/sai.html">
<meta property="og:type"        content="website">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:image"      content="https://catalogo.luxuryhorizon.lat/images/og-catalogo.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap');

:root {
  --midnight:       #0A1A32;
  --midnight-light: #112244;
  --golden:         #B79A49;
  --golden-light:   #d4b86a;
  --bronze:         #A56C30;
  --smoke:          #F0F0F0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Jost', sans-serif;
  background: var(--midnight);
  color: var(--smoke);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
  position: relative;
  overflow: hidden;
}
.bg {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 30%, #112244 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(183,154,73,.18) 0%, transparent 60%),
    var(--midnight);
  z-index: 0;
}
.content { position: relative; z-index: 1; max-width: 460px; }

.back-link {
  position: fixed;
  top: 18px; left: 18px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .62rem;
  letter-spacing: 2px;
  color: var(--midnight);
  background: var(--golden);
  text-decoration: none;
  text-transform: uppercase;
  font-weight: 700;
  padding: 5px 13px 5px 10px;
  border-radius: 20px;
  opacity: .85;
  transition: opacity .2s, transform .15s;
}
.back-link:hover { opacity: 1; transform: translateY(-1px); }

.logo {
  width: 90px; height: 90px;
  object-fit: cover;
  border-radius: 8px;
  border: 2px solid var(--golden);
  margin-bottom: 28px;
}
.emoji { font-size: 3rem; margin-bottom: 18px; opacity: .8; }
.eyebrow {
  font-size: .65rem;
  letter-spacing: 5px;
  color: var(--golden-light);
  text-transform: uppercase;
  margin-bottom: 16px;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.6rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 10px;
}
.badge {
  display: inline-block;
  background: var(--bronze);
  color: #fff;
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 6px 16px;
  border-radius: 20px;
  margin-bottom: 24px;
}
.divider {
  width: 70px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--golden), transparent);
  margin: 0 auto 24px;
}
.tagline {
  font-size: .88rem;
  color: rgba(240,240,240,.65);
  line-height: 1.8;
  margin-bottom: 36px;
}
.wa-button {
  display: inline-block;
  background: linear-gradient(135deg, #0A6630, #1A9E50, #25D366, #1A9E50, #0A6630);
  background-size: 260% auto;
  color: #fff;
  font-size: .78rem; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 14px 32px;
  border-radius: 50px;
  text-decoration: none;
}
.lang-toggle {
  position: fixed;
  top: 18px; right: 18px;
  z-index: 2;
  background: var(--midnight-light);
  color: var(--golden-light);
  border: 1px solid rgba(183,154,73,.4);
  border-radius: 20px;
  padding: 7px 15px;
  font-family: 'Jost', sans-serif;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  cursor: pointer;
}
.lang-toggle:hover { border-color: var(--golden); }
</style>
</head>
<body>

<div class="bg"></div>
<a href="catalogo.html" class="back-link" data-i18n="back">&#8624; &nbsp;Todos los catálogos</a>
<button id="lang-toggle" class="lang-toggle">ES | EN</button>

<div class="content">
  <img class="logo" src="https://luxuryhorizon.lat/biolink/assest/logo.jpeg" alt="Luxury Horizon">
  <div class="emoji">🏝️</div>
  <div class="eyebrow">San Andrés &amp; Providencia · Colombia</div>
  <h1 data-i18n="title">Muy Pronto</h1>
  <div class="badge" data-i18n="badge">Próximamente</div>
  <div class="divider"></div>
  <p class="tagline" data-i18n="tagline">Estamos preparando un catálogo de experiencias exclusivas en el Mar de los Siete Colores. Escríbenos por WhatsApp si quieres ser el primero en conocer los planes disponibles.</p>
  <a class="wa-button" data-i18n="wa" href="https://wa.me/573126322306?text=Hola%2C%20estoy%20interesado%20en%20los%20planes%20de%20San%20Andr%C3%A9s%20y%20Providencia">
    Consultar por WhatsApp
  </a>
</div>

<script>
(function () {
  var translations = {
    es: {
      'back': '&#8624; &nbsp;Todos los catálogos',
      'title': 'Muy Pronto',
      'badge': 'Próximamente',
      'tagline': 'Estamos preparando un catálogo de experiencias exclusivas en el Mar de los Siete Colores. Escríbenos por WhatsApp si quieres ser el primero en conocer los planes disponibles.',
      'wa': 'Consultar por WhatsApp'
    },
    en: {
      'back': '&#8624; &nbsp;All catalogs',
      'title': 'Coming Soon',
      'badge': 'Coming Soon',
      'tagline': "We're preparing a catalog of exclusive experiences in the Sea of Seven Colors. Message us on WhatsApp if you'd like to be the first to know when plans are available.",
      'wa': 'Ask via WhatsApp'
    }
  };

  var saved = localStorage.getItem('lh-lang');
  var browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  var lang = saved || (browserLang.startsWith('es') ? 'es' : 'en');

  function applyLang(l) {
    lang = l;
    localStorage.setItem('lh-lang', l);
    document.documentElement.lang = l;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      var val = translations[l][key];
      if (val) el.innerHTML = val;
    });
    var btn = document.getElementById('lang-toggle');
    if (btn) btn.textContent = l === 'es' ? 'ES | EN' : 'EN | ES';
  }

  document.getElementById('lang-toggle').addEventListener('click', function () {
    applyLang(lang === 'es' ? 'en' : 'es');
  });

  applyLang(lang);
})();
</script>

</body>
</html>
