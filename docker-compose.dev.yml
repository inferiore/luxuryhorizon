services:
  website:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website:/usr/share/nginx/html/website:ro
      - ./biolink:/usr/share/nginx/html/biolink:ro
    environment:
      LEADS_API_URL: ${LEADS_API_URL:-}
    depends_on:
      - leads-api
    restart: unless-stopped

  leads-api:
    build: ./leads-api
    expose:
      - "3100"
    volumes:
      - leads-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LEADS_API_URL: ${LEADS_API_URL:-}
      OPENCLAW_CONTAINER: ${OPENCLAW_CONTAINER:-openclaw-openclaw-gateway-1}
      NOTIFY_PHONE: ${NOTIFY_PHONE:-+573126322306}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-ederb1.1c@gmail.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    restart: unless-stopped

volumes:
  leads-data:
