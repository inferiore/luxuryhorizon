services:
  website:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    environment:
      LEADS_API_URL: ${LEADS_API_URL:-https://luxuryhorizon.lat}
    depends_on:
      - leads-api
    restart: unless-stopped

  leads-api:
    build: ./leads-api
    expose:
      - "3100"
    volumes:
      - leads-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LEADS_API_URL: ${LEADS_API_URL:-https://luxuryhorizon.lat}
      OPENCLAW_CONTAINER: ${OPENCLAW_CONTAINER:-openclaw-openclaw-gateway-1}
      NOTIFY_PHONE: ${NOTIFY_PHONE:-+573126322306}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-ederb1.1c@gmail.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  leads-data:
